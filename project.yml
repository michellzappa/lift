name: Lift
options:
  bundleIdPrefix: app.lift
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  HouseKit:
    path: ../housekit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Same lesson as Tessellate: TCC keys the Accessibility grant to the code
    # signature, so an ad-hoc build loses it on every rebuild. Sign with the
    # stable Apple Development identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: 992N457T8D
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Lift:
    type: application
    platform: macOS
    sources:
      - path: Lift
        excludes:
          - "Resources/Info.plist"
          - "Resources/Lift.entitlements"
    dependencies:
      - package: HouseKit
        product: HouseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lift.Lift
        PRODUCT_NAME: Lift
        CODE_SIGN_ENTITLEMENTS: Lift/Resources/Lift.entitlements
        INFOPLIST_FILE: Lift/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Lift:
    build:
      targets:
        Lift: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
