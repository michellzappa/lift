name: Lift
options:
  bundleIdPrefix: app.lift
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  # The house settings shell, glyphs and changelog view
  # (michellzappa/housekit). Pinned to a release tag so CI, the mini and the
  # laptop build the same code; move the pin on purpose.
  HouseKit:
    url: https://github.com/michellzappa/housekit
    exactVersion: 0.2.0
settings:
  base:
    # The release workflow and scripts/build-app.sh set this to the git
    # commit count. Sparkle compares it, so it must grow with every release.
    CURRENT_PROJECT_VERSION: "1"
    # Sparkle's EdDSA public key (Info.plist SUPublicEDKey). Empty keeps
    # the updater off. housekit/scripts/sparkle-key.sh makes the pair.
    SPARKLE_PUBLIC_ED_KEY: ""
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Same lesson as Tessellate: TCC keys the Accessibility grant to the code
    # signature, so an ad-hoc build loses it on every rebuild. Sign with the
    # stable Apple Development identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: 992N457T8D
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Lift:
    type: application
    platform: macOS
    sources:
      - path: Lift
        excludes:
          - "Resources/Info.plist"
          - "Resources/Lift.entitlements"
      # HouseKit Changelog.load() reads the bundled release notes.
      - path: CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: HouseKit
        product: HouseKit
      - package: HouseKit
        product: HouseKitSparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lift.Lift
        PRODUCT_NAME: Lift
        CODE_SIGN_ENTITLEMENTS: Lift/Resources/Lift.entitlements
        INFOPLIST_FILE: Lift/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Lift:
    build:
      targets:
        Lift: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
